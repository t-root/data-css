<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>data-css-react — Ví dụ mẫu</title>
    <!--
        Ví dụ chạy trực tiếp không cần bundler: React lấy từ esm.sh qua import map,
        JSX được Babel standalone biên dịch trong trình duyệt. Ứng dụng thật nên dùng
        Vite/Next… và import 'data-css-react/react' như hướng dẫn trong README.
    -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useRef, useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { DataCssProvider, useDataCssStatus } from '../../dist/data-css-react/react.js';

        // Bảng màu: nền #05070d · cyan #22d3ee · violet #a78bfa · pink #f472b6 · green #34d399
        // Với React, các chuỗi DSL lặp lại có thể gom thành hằng số và component.
        const MONO = 'font:JetBrains_Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
        const SANS = 'font:Inter,ui-sans-serif,system-ui,-apple-system,Segoe_UI,Roboto,sans-serif';
        const CARD = 'box[p:24px|radius:16px|bg:rgba(15,23,42,0.55)|border:1px_solid_rgba(148,163,184,0.14)]';
        const DASHED = 'radius:12px|border:1px_dashed_rgba(148,163,184,0.25)';

        const TONES = {
            cyan: { bg: 'rgba(34,211,238,0.08)', border: 'rgba(34,211,238,0.3)', text: '#67e8f9', accent: '#22d3ee' },
            violet: { bg: 'rgba(167,139,250,0.1)', border: 'rgba(167,139,250,0.35)', text: '#c4b5fd', accent: '#a78bfa' },
            pink: { bg: 'rgba(244,114,182,0.08)', border: 'rgba(244,114,182,0.3)', text: '#f9a8d4', accent: '#f472b6' },
            green: { bg: 'rgba(52,211,153,0.08)', border: 'rgba(52,211,153,0.3)', text: '#6ee7b7', accent: '#34d399' },
        };

        const columns = (mobile, tablet, desktop, gap = '20px') =>
            `all{box[grid|gap:${gap}]} mobile{box[gridBoxC:${mobile}]} tablet{box[gridBoxC:${tablet}]} desktop{box[gridBoxC:${desktop}]}`;

        const glowLine = (color, inset = '24px') =>
            `content[] pos[absolute|top:0|left:${inset}|right:${inset}] box[h:1px|bg:linear-gradient(90deg,transparent,${color},transparent)]`;

        function Code({ children }) {
            return <code data-css={`text[cl:#67e8f9|${MONO}]`}>{children}</code>;
        }

        function Caption({ children }) {
            return <code data-css={`text[cl:#64748b|size:12px|${MONO}]`}>{children}</code>;
        }

        function Dot({ color = '#34d399' }) {
            return <span data-css={`box[inlineBlock|w:8px|h:8px|radius:50%|bg:${color}|shadow:0_0_10px_${color}]`}></span>;
        }

        function Node({ tone = 'cyan', extra = '', children }) {
            const t = TONES[tone];
            return (
                <div data-css={`box[${extra}p:16px_8px|radius:10px|bg:${t.bg}|border:1px_solid_${t.border}] text[center|cl:${t.text}|size:13px|${MONO}]`}>
                    {children}
                </div>
            );
        }

        function SectionHeader({ index, title, children }) {
            return (
                <header data-css="box[mb:32px|maxW:640px]">
                    <p data-css={`text[cl:#22d3ee|size:12px|uppercase|letterSpacing:0.2em|${MONO}] box[mb:12px]`}
                       data-pe-before="content[// ] text[cl:#475569]">{index}</p>
                    <h2 data-css="text[cl:#f8fafc|size:clamp(26px,3vw,36px)|bold|lh:1.15|letterSpacing:-0.02em] box[mb:12px]">{title}</h2>
                    <p data-css="text[cl:#94a3b8|size:16px|lh:1.7]">{children}</p>
                </header>
            );
        }

        function Nav() {
            const links = ['Typography', 'Layout', 'Interactive', 'Responsive', 'Dynamic'];
            return (
                <nav data-css="pos[sticky|top:0|zIndex:10] box[bg:rgba(5,7,13,0.88)|borderBottom:1px_solid_rgba(148,163,184,0.12)]">
                    <div data-css="box[flex|mainBetween|crossCenter|maxW:1120px|m:0_auto|p:14px_24px]">
                        <a href="#" data-css="box[flex|crossCenter|gap:10px]">
                            <span data-css={`box[flex|mainCenter|crossCenter|w:32px|h:32px|radius:8px|bg:linear-gradient(135deg,#22d3ee,#a78bfa)|shadow:0_0_20px_rgba(34,211,238,0.35)] text[cl:#05070d|bold|size:13px|${MONO}]`}>{'</>'}</span>
                            <span data-css="text[cl:#f8fafc|bold|size:16px|letterSpacing:-0.01em]">data-css</span>
                            <span data-css={`box[p:2px_8px|radius:999px|border:1px_solid_rgba(97,218,251,0.35)] text[cl:#61dafb|size:11px|${MONO}]`}>react</span>
                        </a>
                        <div data-css="all{box[flex|gap:28px]} mobile{box[none]}">
                            {links.map(link => (
                                <a key={link} href={`#${link.toLowerCase()}`}
                                   data-css="anim[transition:color_0.2s_ease] text[cl:#94a3b8|size:14px]"
                                   data-pc-hover="text[cl:#22d3ee]">{link}</a>
                            ))}
                        </div>
                    </div>
                </nav>
            );
        }

        function Hero() {
            // Hook trạng thái runtime: 'loading' → 'ready' (hoặc 'error').
            const status = useDataCssStatus();
            const statusColor = { loading: '#fbbf24', ready: '#34d399', error: '#f87171' }[status];
            const tok = color => `text[cl:${color}]`;
            const TAG = tok('#67e8f9'), ATTR = tok('#c4b5fd'), STR = tok('#86efac');
            return (
                <section data-css="all{box[grid|gap:48px|crossCenter|pt:88px|pb:56px]} mobile{box[gridBoxC:1fr|pt:56px]} tablet{box[gridBoxC:1fr]} desktop{box[gridBoxC:1.05fr_1fr]}">
                    <div>
                        <div data-css={`box[inlineFlex|crossCenter|gap:8px|p:6px_12px|mb:24px|radius:999px|bg:rgba(97,218,251,0.08)|border:1px_solid_rgba(97,218,251,0.3)] text[cl:#61dafb|size:12px|${MONO}]`}>
                            <Dot color={statusColor} />
                            React · useDataCssStatus() = {status}
                        </div>
                        <h1 data-css="text[cl:#f8fafc|size:clamp(36px,5vw,60px)|bold|lh:1.05|letterSpacing:-0.035em] box[mb:20px]">
                            Component React,{' '}
                            <span data-css="box[bg:linear-gradient(90deg,#61dafb,#a78bfa_55%,#f472b6)|bgClip:text] text[cl:transparent]">style bằng data-css</span>
                        </h1>
                        <p data-css="text[cl:#94a3b8|size:17px|lh:1.75] box[maxW:520px|mb:32px]">
                            Bọc ứng dụng trong <Code>{'<DataCssProvider>'}</Code> rồi viết style ngay trên JSX.
                            Chuỗi DSL lặp lại có thể gom thành hằng số và component dùng chung.
                        </p>
                        <div data-css="box[flex|wrap|gap:12px]">
                            <a href="#typography"
                               data-css="cursor[pointer] anim[transition:all_0.25s_ease] box[inlineFlex|crossCenter|gap:8px|p:12px_22px|radius:10px|bg:linear-gradient(135deg,#61dafb,#a78bfa)|shadow:0_8px_30px_rgba(97,218,251,0.25)] text[cl:#05070d|bold|size:14px]"
                               data-pc-hover="tf[transform:translateY(-2px)] box[shadow:0_12px_40px_rgba(167,139,250,0.45)]">
                                Xem ví dụ →
                            </a>
                            <a href="#dynamic"
                               data-css={`cursor[pointer] anim[transition:all_0.25s_ease] box[inlineFlex|crossCenter|gap:8px|p:12px_22px|radius:10px|bg:rgba(15,23,42,0.6)|border:1px_solid_rgba(148,163,184,0.25)] text[cl:#e2e8f0|size:14px|${MONO}]`}
                               data-pc-hover="box[borderColor:rgba(97,218,251,0.6)] text[cl:#61dafb]">
                                $ npm i data-css-react
                            </a>
                        </div>
                    </div>

                    {/* Cửa sổ code */}
                    <div data-css="pos[relative] box[radius:16px|bg:rgba(10,15,28,0.85)|border:1px_solid_rgba(148,163,184,0.16)|shadow:0_30px_80px_rgba(0,0,0,0.55),0_0_0_1px_rgba(97,218,251,0.06)|over:hidden]"
                         data-pe-before={glowLine('rgba(97,218,251,0.8)', '32px')}>
                        <div data-css="box[flex|crossCenter|gap:8px|p:14px_18px|borderBottom:1px_solid_rgba(148,163,184,0.12)]">
                            {['#ff5f57', '#febc2e', '#28c840'].map(color => (
                                <span key={color} data-css={`box[w:11px|h:11px|radius:50%|bg:${color}]`}></span>
                            ))}
                            <span data-css={`box[ml:10px] text[cl:#64748b|size:12px|${MONO}]`}>App.jsx</span>
                        </div>
                        <pre data-css={`box[m:0|p:20px_22px|overX:auto] text[cl:#cbd5e1|size:13px|lh:1.8|${MONO}]`}>
                            <span data-css={TAG}>{'<DataCssProvider'}</span>{' '}<span data-css={ATTR}>assetBase</span>=<span data-css={STR}>"/data-css-react"</span><span data-css={TAG}>{'>'}</span>{'\n'}
                            {'  '}<span data-css={TAG}>{'<button'}</span>{'\n'}
                            {'    '}<span data-css={ATTR}>data-css</span>=<span data-css={STR}>{'"box[p:12px_20px|radius:10px]\n              text[cl:#e2e8f0|bold]"'}</span>{'\n'}
                            {'    '}<span data-css={ATTR}>data-pc-hover</span>=<span data-css={STR}>"box[shadow:0_0_24px_#22d3ee]"</span><span data-css={TAG}>{'>'}</span>{'\n'}
                            {'    Deploy\n'}
                            {'  '}<span data-css={TAG}>{'</button>'}</span>{'\n'}
                            <span data-css={TAG}>{'</DataCssProvider>'}</span>
                        </pre>
                        <div data-css="box[p:12px_22px|borderTop:1px_dashed_rgba(148,163,184,0.16)|bg:rgba(2,6,23,0.6)]">
                            <p data-css={`text[cl:#475569|size:11px|uppercase|letterSpacing:0.15em|${MONO}] box[mb:6px]`}>→ CSS được sinh ra</p>
                            <pre data-css={`box[m:0|overX:auto] text[cl:#64748b|size:12px|lh:1.7|${MONO}]`}>
                                {'.x7f3k { padding: 12px 20px; border-radius: 10px;\n         color: #e2e8f0; font-weight: bold; }\n.x7f3k:hover { box-shadow: 0 0 24px #22d3ee; }'}
                            </pre>
                        </div>
                    </div>
                </section>
            );
        }

        function Stats() {
            const stats = [
                ['6', 'nhóm thuộc tính mặc định', '#22d3ee'],
                ['3', 'breakpoint responsive', '#a78bfa'],
                [':hover', 'pseudo-class & ::before', '#f472b6'],
                ['live', 'theo dõi DOM do React render', '#34d399'],
            ];
            return (
                <section data-css="all{box[grid|gap:1px|radius:14px|over:hidden|bg:rgba(148,163,184,0.14)|border:1px_solid_rgba(148,163,184,0.14)]} mobile{box[gridBoxC:repeat(2,1fr)]} tablet{box[gridBoxC:repeat(4,1fr)]} desktop{box[gridBoxC:repeat(4,1fr)]}">
                    {stats.map(([value, label, color]) => (
                        <div key={label} data-css="box[p:22px|bg:#070b14]">
                            <p data-css={`text[cl:${color}|size:28px|bold|${MONO}]`}>{value}</p>
                            <p data-css="text[cl:#64748b|size:13px]">{label}</p>
                        </div>
                    ))}
                </section>
            );
        }

        function Typography() {
            const rows = [
                ['text[cl:#cbd5e1|size:16px]', 'Văn bản thường', 'text[size:16px]'],
                ['text[cl:#f8fafc|bold|uppercase|letterSpacing:0.12em|size:15px]', 'Bold uppercase', 'text[bold|uppercase]'],
                ['text[cl:#c4b5fd|italic|capitalize|size:16px]', 'italic và capitalize', 'text[italic|capitalize]'],
                ['text[cl:#e2e8f0|underline|decorationColor:#22d3ee|decorationThickness:2px|textUnderlineOffset:5px|size:16px]', 'Gạch chân neon', 'text[underline|decorationColor]'],
                [`text[cl:#67e8f9|bold|size:18px|shadow:0_0_18px_rgba(34,211,238,0.7)|${MONO}]`, 'GLOW_TEXT', 'text[shadow:0_0_18px_...]'],
                ['box[bg:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6)|bgClip:text] text[cl:transparent|bold|size:20px]', 'Gradient text', 'box[bgClip:text]'],
            ];
            const aligns = [
                ['left', '#22d3ee', 'text[left]'],
                ['center', '#a78bfa', 'text[center]'],
                ['right', '#f472b6', 'text[right]'],
                ['justify', '#34d399', 'text[justify] — đoạn văn được căn đều hai bên, khoảng cách giữa các từ tự giãn để lấp đầy chiều rộng khung chứa.'],
            ];
            return (
                <section id="typography" data-css="box[pt:96px]">
                    <SectionHeader index="01 · Typography" title="Kiểu chữ">
                        Nhóm <Code>text[...]</Code> điều khiển màu, cỡ chữ, độ đậm, biến đổi và căn lề.
                    </SectionHeader>
                    <div data-css={columns('1fr', '1fr', '1fr_1fr')}>
                        <div data-css={`pos[relative] ${CARD} box[over:hidden]`} data-pe-before={glowLine('rgba(34,211,238,0.6)')}>
                            <h3 data-css="text[cl:#e2e8f0|size:15px|bold] box[mb:8px]">Text styles</h3>
                            {rows.map(([css, label, caption], i) => (
                                <div key={label} data-css={`box[flex|mainBetween|crossCenter|wrap|gap:8px|${i < rows.length - 1 ? 'p:14px_0|borderBottom:1px_dashed_rgba(148,163,184,0.14)' : 'p:14px_0_0'}]`}>
                                    <span data-css={css}>{label}</span>
                                    <Caption>{caption}</Caption>
                                </div>
                            ))}
                        </div>
                        <div data-css={`pos[relative] ${CARD} box[over:hidden]`} data-pe-before={glowLine('rgba(167,139,250,0.6)')}>
                            <h3 data-css="text[cl:#e2e8f0|size:15px|bold] box[mb:16px]">Text alignment</h3>
                            <div data-css="box[flex|flexY|gap:10px]">
                                {aligns.map(([align, color, label]) => (
                                    <p key={align} data-css={`text[${align}|cl:#cbd5e1|size:14px|lh:1.7] box[p:10px_14px|radius:8px|bg:rgba(2,6,23,0.6)|borderLeft:2px_solid_${color}]`}>{label}</p>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function Layout() {
            const Heading = ({ title, caption }) => (
                <div data-css="box[flex|mainBetween|crossCenter|mb:14px]">
                    <h3 data-css="text[cl:#e2e8f0|size:15px|bold]">{title}</h3>
                    <Caption>{caption}</Caption>
                </div>
            );
            return (
                <section id="layout" data-css="box[pt:96px]">
                    <SectionHeader index="02 · Layout" title="Flex & Grid">
                        Binding như <Code>flex</Code>, <Code>mainBetween</Code>, <Code>gridBoxC</Code> rút gọn các thuộc tính layout thường dùng.
                    </SectionHeader>
                    <div data-css={columns('1fr', '1fr', '1fr_1fr')}>
                        <div data-css={CARD}>
                            <Heading title="Flex row" caption="box[flex|flexItem:1/2/1]" />
                            <div data-css={`box[flex|gap:10px|crossCenter|p:10px|mb:20px|${DASHED}]`}>
                                <Node extra="flexItem:1|">flex:1</Node>
                                <Node tone="violet" extra="flexItem:2|">flex:2</Node>
                                <Node extra="flexItem:1|">flex:1</Node>
                            </div>
                            <Heading title="Flex column" caption="box[flex|flexY|mainCenter]" />
                            <div data-css={`box[flex|flexY|gap:10px|mainCenter|crossStretch|h:200px|p:10px|${DASHED}]`}>
                                {['row-01', 'row-02', 'row-03'].map(row => <Node key={row}>{row}</Node>)}
                            </div>
                        </div>
                        <div data-css={CARD}>
                            <Heading title="Grid 4 cột" caption="gridBoxC:repeat(4,1fr)" />
                            <div data-css={`box[grid|gridBoxC:repeat(4,1fr)|gap:10px|p:10px|mb:20px|${DASHED}]`}>
                                {['01', '02', '03', '04'].map(cell => <Node key={cell} tone="violet">{cell}</Node>)}
                            </div>
                            <Heading title="Grid phức hợp" caption="gridBoxC:2fr_1fr_1fr" />
                            <div data-css={`box[grid|gridBoxC:2fr_1fr_1fr|gridBoxR:1fr_1fr|gap:10px|h:200px|p:10px|${DASHED}]`}>
                                <Node extra="gridR:span_2|flex|mainCenter|crossCenter|">main · 2fr</Node>
                                <Node extra="flex|mainCenter|crossCenter|">1fr</Node>
                                <Node extra="flex|mainCenter|crossCenter|">1fr</Node>
                                <Node tone="pink" extra="gridC:span_2|flex|mainCenter|crossCenter|">span 2</Node>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function FeatureCard({ tone, rgb, icon, title, shadow, children }) {
            const t = TONES[tone];
            return (
                // className tĩnh để parent[.feature-card] làm selector; runtime tự thêm class sinh ra.
                <div className="feature-card"
                     data-css={`pos[relative] anim[transition:all_0.3s_ease] ${CARD} box[over:hidden]`}
                     data-pc-hover={`tf[transform:translateY(-6px)] box[borderColor:rgba(${rgb},0.5)|shadow:0_20px_50px_${shadow}]`}
                     data-pe-before={glowLine(`rgba(${rgb},0.7)`)}>
                    <div data-css={`anim[transition:all_0.3s_ease] box[flex|mainCenter|crossCenter|w:44px|h:44px|mb:18px|radius:12px|bg:rgba(148,163,184,0.08)|border:1px_solid_rgba(148,163,184,0.18)] text[cl:#94a3b8|bold|size:15px|${MONO}]`}
                         data-pc-hover={`parent[.feature-card] box[bg:${t.bg}|borderColor:${t.border}] text[cl:${t.accent}]`}>{icon}</div>
                    <h3 data-css="anim[transition:color_0.3s_ease] text[cl:#f1f5f9|bold|size:17px] box[mb:8px]"
                        data-pc-hover={`parent[.feature-card] text[cl:${t.accent}]`}>{title}</h3>
                    {children}
                </div>
            );
        }

        function Interactive() {
            const buttons = [
                ['cyan', 'tf[transform:scale(1.06)]', 'scale(1.06)'],
                ['violet', 'tf[transform:rotate(-3deg)]', 'rotate(-3deg)'],
                ['pink', 'tf[transform:translateY(-4px)]', 'translateY(-4px)'],
            ];
            const Muted = ({ children }) => <code data-css={`text[cl:#cbd5e1|size:13px|${MONO}]`}>{children}</code>;
            return (
                <section id="interactive" data-css="box[pt:96px]">
                    <SectionHeader index="03 · Interactive" title="Pseudo-class & pseudo-element">
                        Thuộc tính <Code>data-pc-*</Code> sinh ra <Code>:hover</Code>, <Code>:active</Code>…; <Code>data-pe-before/after</Code> sinh ra <Code>::before</Code> và <Code>::after</Code>.
                    </SectionHeader>
                    <div data-css="box[flex|wrap|gap:14px|mb:28px]">
                        {buttons.map(([tone, effect, label]) => {
                            const t = TONES[tone];
                            return (
                                <button key={label}
                                        data-css={`cursor[pointer] anim[transition:all_0.25s_ease] box[p:12px_20px|radius:10px|bg:${t.bg}|border:1px_solid_${t.border}] text[cl:${t.text}|bold|size:13px|${MONO}]`}
                                        data-pc-hover={`${effect} box[shadow:0_0_28px_${t.border}]`}>
                                    {label}
                                </button>
                            );
                        })}
                        <button data-css={`cursor[pointer] anim[transition:all_0.25s_ease] box[p:12px_20px|radius:10px|bg:${TONES.green.bg}|border:1px_solid_${TONES.green.border}] text[cl:#6ee7b7|bold|size:13px|${MONO}]`}
                                data-pc-hover="box[bg:rgba(52,211,153,0.16)]"
                                data-pc-active="tf[transform:scale(0.94)]">
                            :active
                        </button>
                    </div>
                    <div data-css={columns('1fr', 'repeat(3,1fr)', 'repeat(3,1fr)')}>
                        <FeatureCard tone="cyan" rgb="34,211,238" icon=":h" title="Pseudo-class" shadow="rgba(8,145,178,0.25)">
                            <p data-css="text[cl:#94a3b8|size:14px|lh:1.7]">Một thuộc tính <Muted>data-pc-hover</Muted> là đủ để thẻ nổi lên và phát sáng.</p>
                        </FeatureCard>
                        <FeatureCard tone="violet" rgb="167,139,250" icon="↑" title="Parent selector" shadow="rgba(124,58,237,0.25)">
                            <p data-css="text[cl:#94a3b8|size:14px|lh:1.7]"><Muted>parent[.feature-card]</Muted> — hover thẻ cha, icon và tiêu đề bên trong đổi màu.</p>
                        </FeatureCard>
                        <FeatureCard tone="pink" rgb="244,114,182" icon="::" title="Pseudo-element" shadow="rgba(219,39,119,0.22)">
                            <p data-css="text[cl:#94a3b8|size:14px|lh:1.7] box[mb:14px]">Badge dưới đây có dấu chấm sinh bằng <Muted>data-pe-before</Muted>.</p>
                            <span data-css={`box[inlineFlex|crossCenter|gap:6px|p:4px_10px|radius:999px|bg:rgba(244,114,182,0.1)|border:1px_solid_rgba(244,114,182,0.35)] text[cl:#f9a8d4|size:11px|${MONO}]`}
                                  data-pe-before="content[●] text[cl:#f472b6]">NEW · ::before</span>
                        </FeatureCard>
                    </div>
                </section>
            );
        }

        function Responsive() {
            const nodes = [['node-01', '82%'], ['node-02', '56%'], ['node-03', '94%']];
            const breakpoints = [['mobile', '1 cột'], ['tablet', '2 cột'], ['desktop', '3 cột']];
            return (
                <section id="responsive" data-css="box[pt:96px]">
                    <SectionHeader index="04 · Responsive" title="Breakpoint">
                        Bọc style trong <Code>mobile{'{…}'}</Code>, <Code>tablet{'{…}'}</Code>, <Code>desktop{'{…}'}</Code>. Thay đổi độ rộng cửa sổ để thấy lưới đổi số cột.
                    </SectionHeader>
                    <div data-css={`box[inlineFlex|crossCenter|gap:10px|p:8px_14px|mb:20px|radius:999px|bg:rgba(52,211,153,0.08)|border:1px_solid_rgba(52,211,153,0.35)] text[cl:#6ee7b7|size:12px|${MONO}]`}>
                        <Dot />
                        breakpoint:
                        {breakpoints.map(([device, label]) => (
                            <strong key={device} data-css={`all{box[none] text[cl:#f8fafc]} ${device}{box[inline]}`}>{device} · {label}</strong>
                        ))}
                    </div>
                    {/* children[...]: hover vào từng node con */}
                    <div data-css={columns('1fr', 'repeat(2,1fr)', 'repeat(3,1fr)', '16px')}
                         data-pc-hover="children[.resp-node] box[borderColor:#34d399|shadow:0_0_30px_rgba(52,211,153,0.25)]">
                        {nodes.map(([name, width]) => (
                            <div key={name} className="resp-node" data-css="anim[transition:all_0.25s_ease] box[p:20px|radius:14px|bg:rgba(15,23,42,0.55)|border:1px_solid_rgba(52,211,153,0.2)]">
                                <p data-css={`text[cl:#6ee7b7|size:12px|${MONO}] box[mb:10px]`}>{name}</p>
                                <div data-css="box[h:6px|radius:999px|bg:rgba(148,163,184,0.12)|over:hidden]">
                                    <div data-css={`box[w:${width}|h:100%|radius:999px|bg:linear-gradient(90deg,#34d399,#22d3ee)]`}></div>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        function Dynamic() {
            const [nodes, setNodes] = useState([]);
            const nextId = useRef(1);
            const add = () => setNodes(list => [...list, nextId.current++]);
            const reset = () => { nextId.current = 1; setNodes([]); };
            return (
                <section id="dynamic" data-css="box[pt:96px]">
                    <SectionHeader index="05 · Dynamic" title="State & re-render">
                        Phần tử React render thêm sau khi mount vẫn được runtime phát hiện qua MutationObserver và biên dịch style tự động.
                    </SectionHeader>
                    <div data-css={CARD}>
                        <div data-css="box[flex|wrap|mainBetween|crossCenter|gap:12px|mb:20px]">
                            <div data-css="box[flex|wrap|gap:10px]">
                                <button onClick={add}
                                        data-css={`cursor[pointer] anim[transition:all_0.25s_ease] box[p:10px_18px|radius:10px|bg:linear-gradient(135deg,#a78bfa,#61dafb)|border:none] text[cl:#05070d|bold|size:13px|${MONO}]`}
                                        data-pc-hover="tf[transform:translateY(-2px)] box[shadow:0_10px_30px_rgba(167,139,250,0.4)]">
                                    + setNodes()
                                </button>
                                <button onClick={reset}
                                        data-css={`cursor[pointer] anim[transition:all_0.25s_ease] box[p:10px_18px|radius:10px|bg:transparent|border:1px_solid_rgba(148,163,184,0.25)] text[cl:#94a3b8|size:13px|${MONO}]`}
                                        data-pc-hover="box[borderColor:rgba(244,114,182,0.6)] text[cl:#f472b6]">
                                    reset
                                </button>
                            </div>
                            <p data-css={`text[cl:#64748b|size:12px|${MONO}]`}>
                                nodes: <span data-css="text[cl:#22d3ee|bold]">{nodes.length}</span>
                            </p>
                        </div>
                        {nodes.length === 0 ? (
                            <p data-css={`box[p:28px|${DASHED}] text[center|cl:#475569|size:13px|${MONO}]`}>
                                {'> chưa có node nào — bấm setNodes()'}
                            </p>
                        ) : (
                            <div data-css={columns('1fr', 'repeat(2,1fr)', 'repeat(3,1fr)', '14px')}>
                                {nodes.map(id => (
                                    <div key={id}
                                         data-css={`anim[transition:all_0.25s_ease] box[flex|mainBetween|crossCenter|p:16px_18px|radius:12px|bg:rgba(167,139,250,0.08)|border:1px_solid_rgba(167,139,250,0.3)] text[cl:#c4b5fd|size:13px|${MONO}]`}
                                         data-pc-hover="tf[transform:translateY(-3px)] box[borderColor:#a78bfa|shadow:0_0_24px_rgba(167,139,250,0.3)]">
                                        {`node-${String(id).padStart(2, '0')}`}
                                        <span data-css="text[cl:#34d399|size:11px]">● mounted</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </section>
            );
        }

        function App() {
            return (
                <DataCssProvider
                    assetBase="../../dist/data-css-react/assets"
                    onReady={() => console.info('data-css-react đã sẵn sàng')}
                    onError={() => console.error('Không đọc được config data-css')}
                >
                    <div data-css={`box[minH:100vh|bg:radial-gradient(ellipse_80%_50%_at_50%_-10%,rgba(97,218,251,0.16),transparent_70%),linear-gradient(rgba(148,163,184,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(148,163,184,0.05)_1px,transparent_1px),#05070d|bgSize:100%_100%,48px_48px,48px_48px|bgFixed] text[cl:#cbd5e1|lh:1.6|${SANS}]`}>
                        <Nav />
                        <main data-css="box[maxW:1120px|m:0_auto|p:0_24px]">
                            <Hero />
                            <Stats />
                            <Typography />
                            <Layout />
                            <Interactive />
                            <Responsive />
                            <Dynamic />
                            <footer data-css={`box[flex|wrap|mainBetween|crossCenter|gap:12px|mt:96px|p:28px_0|borderTop:1px_solid_rgba(148,163,184,0.12)] text[cl:#475569|size:13px|${MONO}]`}>
                                <span>built with data-css-react · 0 dòng CSS viết tay</span>
                                <span data-css="text[cl:#64748b]">MIT License</span>
                            </footer>
                        </main>
                    </div>
                </DataCssProvider>
            );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
